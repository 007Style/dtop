[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtop"
version = "0.1.0"
description = "dtop (Desultory Top) - find processes with very infrequent network activity, with a self-adjusting sliding window"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["network", "monitor", "top", "nmon", "security", "tui", "beacon", "processes"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "textual>=1.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
]

[project.scripts]
dtop = "dtop.cli:main"

[project.urls]
Homepage = "https://github.com/007Style/dtop"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
